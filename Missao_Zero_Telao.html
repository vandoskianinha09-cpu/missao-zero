<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão Zero Telão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;--bg:#F5F4F2;--pn:#FFFFFF;--pn2:#ECEAE5;--ln:#D8D4CC;--ink:#14243A;--mu:#5B6573;--y:#194682;--acc:#AFB91E;--g:#2E8B3E;--r:#C62F2F;--b:#0A91C3;--c:#194682;--disp:"Baloo Chettan 2","Trebuchet MS","Segoe UI",Arial,sans-serif;--body:"Baloo Chettan 2","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--ln);background:var(--pn2);color:var(--ink);padding:10px 16px;font-weight:600}
button:hover{border-color:var(--y)}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
button.go{background:var(--y);border-color:var(--y);color:#fff;font-weight:800}
input,select{font:inherit;background:var(--pn);color:var(--ink);border:2px solid var(--ln);border-radius:10px;padding:10px 12px}
input:focus{outline:none;border-color:var(--y)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--ln);flex:none}
.bar{background:var(--pn);border-bottom:3px solid var(--acc)!important}.bar .lg{display:flex;align-items:center;gap:14px}.bar .lg img{height:34px;width:auto}.bar .lg i{width:2px;height:28px;background:var(--ln);transform:skewX(-15deg)}
.foot{background:var(--pn)}
.col,.fl,.gab div,.photo,.menu .card{box-shadow:0 2px 6px #14243A14}
.cover-logo{display:block;width:min(360px,60%);height:auto;margin:0 0 6px}
h1,h2{color:var(--y)}h1::after{content:"";display:block;width:140px;height:6px;border-radius:99px;background:var(--acc);margin-top:14px}
.hora .qq{color:var(--ink)}
.final-logos{display:flex;gap:40px;justify-content:center;align-items:center;margin-top:20px}.final-logos img{height:70px;width:auto}
.bar .t{font-family:var(--disp);font-weight:700;font-size:20px}
.bar .t small{font-family:var(--body);font-weight:500;color:var(--mu);font-size:13px;margin-left:10px}
.bar .clk{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums;font-size:15px}
.bar .clk b{color:var(--y)}
.stage{flex:1;overflow-y:auto;padding:28px 40px}
.sl{max-width:1180px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
.sl.back{animation-name:inb}@keyframes inb{from{opacity:0;transform:translateX(-24px)}}
.foot{flex:none;display:flex;align-items:center;gap:12px;padding:10px 24px;border-top:1px solid var(--ln)}
.foot .prog{flex:1;height:6px;background:var(--pn2);border-radius:99px;overflow:hidden}
.foot .prog i{display:block;height:100%;background:var(--y);transition:width .3s}
.foot .n{color:var(--mu);font-variant-numeric:tabular-nums;font-size:14px;min-width:70px;text-align:center}
.foot .arw{font-size:22px;padding:6px 18px}
.eb{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(48px,7vw,96px);line-height:.95;margin:10px 0 16px;text-wrap:balance}
h2{font-family:var(--disp);font-weight:800;font-size:clamp(34px,4.2vw,56px);line-height:1.02;margin:6px 0 18px;text-wrap:balance}
.p{font-size:24px;line-height:1.45;color:var(--mu);max-width:62ch;margin:0 0 18px}
ul.b{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.b li{font-size:25px;line-height:1.35;padding:10px 0 10px 38px;position:relative;border-bottom:1px solid var(--ln)}
ul.b li::before{content:"";position:absolute;left:4px;top:21px;width:16px;height:16px;border-radius:3px;background:var(--c)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.col{background:var(--pn);border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:10px;padding:18px}
.col h4{margin:0 0 8px;font-family:var(--disp);font-size:26px;line-height:1.1}
.col ul{margin:0;padding-left:20px}.col li{font-size:19px;margin:6px 0}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.fl{flex:1 1 170px;background:var(--pn);border:2px solid var(--c);border-radius:10px;padding:16px}
.fl b{display:block;font-family:var(--disp);font-size:28px;color:var(--c);margin-bottom:6px}
.fl span{font-size:17px}
.ar{align-self:center;font-size:36px;color:var(--c);font-weight:800}
.quote{font-family:var(--disp);font-weight:800;font-size:clamp(34px,4.6vw,60px);line-height:1.1;color:var(--c);margin:20px 0;text-wrap:balance}
.ask{margin-top:20px;padding:16px 20px;border-radius:10px;background:#F3F6DC;border:2px solid var(--acc);font-size:22px;line-height:1.4}
.ask b{color:var(--y)}
.comp7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.comp7 div{border-radius:10px;padding:18px 10px;text-align:center;font-weight:800;font-size:18px;color:#fff;line-height:1.2}
.comp7 div b{display:block;font-family:var(--disp);font-size:40px}
.pyr{display:grid;justify-items:center;gap:6px;margin:10px 0 14px}
.pyr div{color:#fff;font-weight:800;font-size:22px;text-align:center;padding:16px 0;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.scale{height:26px;border-radius:99px;background:linear-gradient(90deg,#1faa59,#f5c400,#e5383b);margin:10px 0 6px}
.sm{display:flex;justify-content:space-between;color:var(--mu);font-size:18px}
/* intro */
.intro{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;min-height:60vh}
.intro .num{font-family:var(--disp);font-weight:800;font-size:clamp(160px,22vw,300px);line-height:.8;color:var(--c)}
/* game */
.game{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:start}
.senha{font-family:var(--disp);font-weight:800;font-size:clamp(64px,9vw,128px);letter-spacing:.08em;line-height:1;background:var(--y);color:#fff;border-radius:12px;padding:16px 26px;display:inline-block;margin:6px 0 18px}
.qrw{background:#fff;border-radius:14px;padding:14px;color:#14243A;border:1px solid var(--ln);text-align:center}
.qrw svg{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
.qrw b{display:block;font-size:18px;margin-top:6px}
.qrw small{display:block;font-size:13px;color:#445;word-break:break-all}
.cd{display:flex;align-items:center;gap:14px;margin-top:10px}
.cd .v{font-family:var(--disp);font-weight:800;font-size:56px;font-variant-numeric:tabular-nums;min-width:150px}
.cd .tb{flex:1;height:14px;background:var(--pn2);border-radius:99px;overflow:hidden}
.cd .tb i{display:block;height:100%;background:var(--y);width:100%;transition:width 1s linear}
.steps{margin:0;padding-left:26px;font-size:22px;line-height:1.5}
/* gabarito */
.gab{display:grid;gap:10px}
.gab div{background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--g);border-radius:8px;padding:12px 16px}
.gab .q{font-size:18px;color:var(--mu)}
.gab .a{font-size:22px;font-weight:700;margin-top:2px}
/* hora */
.hora{text-align:center;padding-top:4vh}
.hora .big{font-family:var(--disp);font-weight:800;font-size:clamp(60px,8vw,110px);line-height:1;color:var(--y)}
.hora .sub{letter-spacing:.3em;color:var(--mu);font-size:20px;margin:10px 0 30px}
.hora .qq{font-family:var(--disp);font-weight:700;font-size:clamp(34px,4vw,54px);line-height:1.15;max-width:22ch;margin:0 auto;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.chip{border:2px solid var(--tc);background:transparent;border-radius:99px;padding:10px 18px}
.chip.on{background:var(--tc);color:#fff}
/* placar */
.pl{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.rank{display:grid;gap:10px}
.rr{display:grid;grid-template-columns:34px 1fr 70px;gap:12px;align-items:center}
.rr .nm{font-weight:700;font-size:19px;margin-bottom:4px;display:flex;justify-content:space-between}
.rr .bb{height:22px;background:var(--pn2);border-radius:5px;overflow:hidden}
.rr .bb i{display:block;height:100%;background:var(--tc);transition:width .6s ease}
.rr .pts{font-family:var(--disp);font-weight:800;font-size:30px;text-align:right;font-variant-numeric:tabular-nums}
.rr .ps{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--mu)}
.codein{display:flex;gap:10px;margin:8px 0}
.codein input{flex:1;font-family:var(--disp);font-size:34px;letter-spacing:.12em;text-transform:uppercase}
.msg{min-height:28px;font-weight:700;font-size:18px}
.msg.ok{color:var(--g)}.msg.bad{color:var(--r)}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat span{font-size:14px;padding:5px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.stat span.ok{border-color:var(--g);color:var(--g)}
.seal{margin-top:18px;padding:16px 18px;border:2px dashed var(--c);border-radius:12px;font-size:22px}
.seal b{color:var(--c)}
/* photo */
.photo{border:2px dashed var(--ln);border-radius:12px;min-height:58vh;display:grid;place-items:center;overflow:hidden;background:var(--pn)}
.photo img{max-width:100%;max-height:64vh;display:block}
.revcode{font-family:var(--disp);font-weight:800;font-size:clamp(70px,10vw,140px);letter-spacing:.2em;background:var(--y);color:#fff;border-radius:14px;padding:10px 30px;display:inline-block}
.rkr{display:grid;grid-template-columns:120px 1fr 50px;gap:14px;align-items:center;font-size:22px;margin:8px 0}
.rkr input{accent-color:var(--y);padding:0;border:0;background:none}
/* podium */
.pod{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin:26px 0}
.pod div{width:220px;text-align:center}
.pod .blk{border-radius:10px 10px 0 0;background:var(--tc);color:#fff;font-family:var(--disp);font-size:60px;font-weight:800;display:grid;place-items:center}
.pod .nm{font-family:var(--disp);font-size:30px;font-weight:800}
.pod .sc{color:var(--mu);margin-bottom:8px}
table.rub{width:100%;border-collapse:collapse;font-size:18px}
table.rub td,table.rub th{padding:10px;border-top:1px solid var(--ln);text-align:center}
table.rub td:first-child,table.rub th:first-child{text-align:left}
table.rub input{width:26px;height:26px;accent-color:var(--y)}
.setrow{display:flex;gap:10px;align-items:center;margin:8px 0}
.sw{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.menu{position:fixed;inset:0;background:#14243A99;display:grid;place-items:center;z-index:20}
.menu .card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:24px;width:min(640px,92vw);max-height:86vh;overflow:auto}
.menu .it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:6px 0;border-left:6px solid var(--mc)}
.menu .it span{margin-left:auto;color:var(--mu);font-size:14px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;font-weight:800;padding:12px 22px;border-radius:10px;z-index:30;font-size:20px}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:40;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hint{color:var(--mu);font-size:14px}
@media (max-width:900px){.game,.pl{grid-template-columns:1fr}.comp7{grid-template-columns:repeat(2,1fr)}.intro{grid-template-columns:1fr}.stage{padding:20px 16px}}
.vid{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #14243A33}
.vid video{display:block;width:100%;max-height:68vh;background:#000}
.vend{position:absolute;inset:0;background:#194682E6;color:#fff;display:grid;place-items:center;text-align:center;padding:30px}
.vend h3{font-family:var(--disp);font-size:clamp(34px,4vw,56px);margin:0 0 10px;color:#fff}
.vend p{font-size:22px;margin:0 0 22px;color:#fff}
.vend button{background:var(--acc);border-color:var(--acc);color:#14243A;font-weight:800;font-size:20px;padding:12px 24px}
.vmiss{padding:40px;text-align:center;color:#fff}
.talk{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:start}
.talk ol{margin:0;padding-left:30px;font-size:25px;line-height:1.4}
.talk ol li{margin:0 0 14px;padding-left:6px}
.talk ol li::marker{color:var(--acc);font-family:var(--disp);font-weight:800}
.notes{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px}
.notes textarea{width:100%;min-height:180px;font:inherit;font-size:18px;border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);resize:vertical}
@media (max-width:900px){.talk{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }

    ${teams().map(t=>`<div class="setrow"><span class="sw" style="background:${t.c}">${t.num}</span><input style="flex:1" id="tn${t.i}" data-tn="${t.i}" value="${esc(t.name)}"></div>`).join("")}
    <div class="setrow" style="margin-top:14px"><label style="min-width:230px">Link do app das equipes</label><input style="flex:1" id="app" data-kv="app" value="${esc(S.app||"")}" placeholder="Cole aqui o endereço onde o index.html foi hospedado"></div>
    <div class="setrow" style="margin-top:16px">${S.t0?`<span class="hint">Treinamento iniciado às ${new Date(S.t0).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span><button data-a="t0">Reiniciar relógio</button>`:`<button class="go" data-a="t0">Iniciar relógio do treinamento</button>`}<button data-a="reset" id="rst">Zerar placar</button></div>
    <p class="hint">Navegação: → ou espaço avança · ← volta · M abre os módulos · funciona com passador de slides.</p></div>
    <div>${qrBlock("App das equipes")}</div></div>`;
  }else if(d.k==="join"){
    h=`<div class="eb">Como vai funcionar</div><h2>Entre no jogo: um celular por equipe</h2>
    <div class="game"><div><ol class="steps"><li>Aponte a câmera para o QR code e abra o app</li><li>Escolha o <b>número</b> da sua equipe e escreva o nome</li><li>Em cada módulo, depois da explicação, o telão mostra a <b>senha</b></li><li>Respondam juntos: acerto pontua na hora, erro não pontua</li><li>No fim do módulo o app mostra a pontuação e um <b>código</b>; o facilitador lança no placar</li></ol>
    <div style="margin-top:18px">${teams().map(t=>`<div class="setrow"><span class="sw" style="background:${t.c}">${t.num}</span><b style="font-size:20px">${esc(t.name)}</b></div>`).join("")}</div>
    <div class="ask"><b>Pontuação:</b> quiz 10 · sequência até 15 · foto até 10 · módulo perfeito +5 · Chegou a hora +5 · poderes <b>2x Gemba</b> e <b>Chame o Líder</b> (1 uso cada)</div></div>
    <div>${qrBlock("App das equipes")}</div></div>`;
  }else if(d.k==="video"){
    h=`<div class="eb">Abertura · Momento de Segurança</div><h2>Momento de Segurança</h2>
    <div class="vid" id="vbox"><video id="vmz" src="${VIDSRC||"momento_seguranca.mp4"}" controls playsinline preload="auto"></video></div>
    <p class="hint" style="margin-top:10px">Espaço reproduz ou pausa o vídeo · → segue para a conversa com o grupo · <label style="text-decoration:underline;cursor:pointer">carregar o vídeo de outro local<input type="file" accept="video/*" id="vpick" hidden></label></p>`;
  }else if(d.k==="talk"){
    h=`<div class="eb">Abertura · Momento de Segurança</div><h2>Vamos conversar sobre o vídeo</h2>
    <div class="talk"><div><ol>
      <li>O que você ensina para a sua família sobre <b>voltar para casa todos os dias</b>? E o que sua equipe aprende com você sobre isso?</li>
      <li>"No operacional, a sorte não evita acidentes." Onde, na sua área, ainda contamos com a sorte?</li>
      <li>Quem está esperando por você em casa hoje? E pelas pessoas da sua equipe?</li>
      <li>Qual atitude sua, no dia a dia, mostra para a equipe que você cuida dela?</li>
      <li>Depois deste vídeo, o que muda amanhã no seu Gemba?</li></ol>
      <div class="ask"><b>Facilitador:</b> escolha 2 ou 3 perguntas, ouça pelo menos 3 líderes e valorize cada fala.</div></div>
    <div><div class="cd" style="margin-top:0"><span class="v" id="cdv">5:00</span><div class="tb"><i id="cdb"></i></div><button class="go" data-a="cd" data-min="5">Iniciar</button></div>
      <div class="notes" style="margin-top:16px"><div class="hint" style="margin-bottom:6px">Anotações do grupo (ficam só nesta tela)</div><textarea id="talknotes" data-kv="talk" placeholder="Registre aqui as falas e ideias que surgirem…">${esc(S.talk||"")}</textarea></div></div></div>`;
  }else if(d.k==="slide"||d.k==="info"){
    const r=d.r;
    if(d.k==="info")h=`<div class="eb">Prática de campo</div><h2>${r.q}</h2><ul class="b">${r.li.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    else h=`<div class="eb">${d.m===0?"Abertura":d.m+"ª Competência · "+s.name}</div>${slideHTML(r)}`;
  }else if(d.k==="intro"){
    h=`<div class="intro"><div class="num">${d.m===8?"G":d.m}</div><div><div class="eb">${d.m===8?"Prática de campo · 1 hora":d.m+"ª Competência"}</div><h1>${s.name}</h1><p class="p">${s.lema}</p>${s.badge?`<div class="hint" style="font-size:18px">Selo em disputa: <b style="color:var(--c)">${s.badge}</b></div>`:""}</div></div>`;
  }else if(d.k==="game"){
    const qs=s.rounds.filter(r=>r.t==="quiz"||r.t==="order");
    h=`<div class="eb">${d.m}ª Competência · Hora do game</div><h2>Abram o módulo ${d.m} no celular</h2>
    <div class="game"><div><div class="hint" style="font-size:18px">Senha do módulo</div><div class="senha">${WORDS[d.m]}</div>
    <p class="p">${qs.length} ${qs.length>1?"perguntas":"pergunta"}${d.m===4?" + classificação das 4 fotos":""}. Acerto pontua na hora; o tempo acaba em 45 s por pergunta.</p>
    <div class="cd"><span class="v" id="cdv">${GMIN[d.m]}:00</span><div class="tb"><i id="cdb"></i></div><button class="go" data-a="cd" data-min="${GMIN[d.m]}">Iniciar tempo</button></div></div>
    <div>${qrBlock("Ainda não entrou? Aponte aqui")}</div></div>`;
  }else if(d.k==="photo"){
    const img=photos[d.f];
    h=`<div class="eb">4ª Competência · Percepção de Risco</div><h2>Foto ${d.f}: qual a nota de risco (0 a 10)?</h2>
    <div class="photo">${img?`<img src="${img}" alt="Foto ${d.f}">`:`<div style="text-align:center"><p class="p">Carregue a Foto ${d.f} do seu material</p><label><span class="go" style="display:inline-block;padding:12px 20px;border-radius:10px;background:var(--y);color:#fff;font-weight:800;cursor:pointer">Carregar foto</span><input type="file" accept="image/*" data-ph="${d.f}" id="ph${d.f}" hidden></label></div>`}</div>
    ${img?`<p class="hint">Para trocar: <label style="text-decoration:underline;cursor:pointer">escolher outra imagem<input type="file" accept="image/*" data-ph="${d.f}" id="ph${d.f}" hidden></label></p>`:""}`;
  }else if(d.k==="reveal"){
    h=`<div class="eb">4ª Competência · Percepção de Risco</div><h2>Nota do SST para as 4 fotos</h2>
    <div class="game"><div>${S.refs.map((v,i)=>`<div class="rkr"><b>Foto ${i+1}</b><input type="range" min="0" max="10" value="${v}" data-ref="${i}" id="ref${i}"><b id="rv${i}">${showRev?v:"?"}</b></div>`).join("")}
    <p class="hint">Ajuste as notas antes da aula ou agora (o número só aparece depois de revelar). As equipes travam as notas no celular antes da revelação.</p>
    <button class="go" data-a="rev">${showRev?"Ocultar":"Revelar senha de revelação"}</button></div>
    <div style="text-align:center">${showRev?`<div class="hint" style="font-size:18px">Senha de revelação</div><div class="revcode">${S.refs.map(v=>RALPH[v]).join("")}</div><p class="p" style="margin:16px auto">Digitem no celular para ver a pontuação das fotos.</p>`:`<p class="p">Aguardando todas as equipes travarem as notas…</p>`}</div></div>`;
  }else if(d.k==="gab"){
    const qs=s.rounds.filter(r=>r.t==="quiz"||r.t==="order");
    h=`<div class="eb">${d.m}ª Competência · Gabarito comentado</div><h2>Vamos conferir as respostas</h2><div class="gab">${qs.map(q=>`<div><div class="q">${q.q}</div><div class="a">${q.t==="quiz"?q.o[q.c]:q.items.map((x,i)=>(i+1)+". "+x).join(" · ")}</div>${q.e?`<div class="hint" style="font-size:16px;margin-top:4px">${q.e}</div>`:""}</div>`).join("")}</div>`;
  }else if(d.k==="hora"){
    const vz=S.voz[d.m]||[];
    h=`<div class="hora"><div class="big">CHEGOU A HORA!!</div><div class="sub">RESPONDA COM SINCERIDADE</div><div class="qq">${d.r.q}</div>${d.r.sub2?`<p class="p" style="margin:20px auto">${d.r.sub2}</p>`:""}
    <div class="hint" style="margin-top:30px">Equipes que compartilharam (+5 Voz da Liderança)</div>
    <div class="chips">${teams().map(t=>`<button class="chip ${vz.includes(t.i)?"on":""}" style="--tc:${t.c}" data-voz="${t.i}">${t.num} · ${esc(t.name)}</button>`).join("")}</div></div>`;
  }else if(d.k==="placar"){
    const got=S.sc[d.m]||{};const L=leader(d.m);
    h=`<div class="eb">${d.m}ª Competência · Placar do módulo</div><h2>Lancem os códigos das equipes</h2>
    <div class="pl"><div><div class="codein"><input id="code" maxlength="9" placeholder="Ex.: 32045QK" autocomplete="off"><button class="go" data-a="code">Lançar</button></div><div class="msg" id="msg"></div>
    <div class="stat">${teams().map(t=>`<span class="${got[t.i]!=null?"ok":""}">${t.num} ${got[t.i]!=null?"✓ "+got[t.i]:"aguardando"}</span>`).join("")}</div>
    <div class="hint" style="margin:22px 0 8px;font-size:16px">Pontos neste módulo</div>${rankHTML(t=>modPts(d.m,t))}
    ${L.length?`<div class="seal">Selo <b>${s.badge}</b>: ${L.map(t=>esc(t.name)).join(" e ")}</div>`:""}</div>
    <div><div class="hint" style="margin:0 0 8px;font-size:16px">Placar geral</div>${rankHTML(totPts)}</div></div>`;
  }else if(d.k==="break"){
    h=`<div class="eb">Intervalo</div><h1>15 minutos</h1><div class="cd"><span class="v" id="cdv">15:00</span><div class="tb"><i id="cdb"></i></div><button class="go" data-a="cd" data-min="15">Iniciar</button></div><div style="margin-top:26px;max-width:760px">${rankHTML(totPts)}</div>`;
  }else if(d.k==="rankp"){
    h=`<div class="eb">Encerramento da parte teórica</div><h2>Placar parcial: o ranking final sai depois da prática no Gemba</h2><div style="max-width:860px">${rankHTML(totPts)}</div>
    <div class="stat" style="margin-top:18px">${teams().map(t=>`<span>${esc(t.name)}: ${badges(t.i).join(" · ")||"sem selos"}</span>`).join("")}</div>`;
  }else if(d.k==="rubric"){
    const r=d.r;
    h=`<div class="eb">Prática de campo · Missão Gemba</div><h2>Pontuação das observações (5 pts por critério)</h2>
    <div style="overflow-x:auto"><table class="rub"><tr><th>Critério</th>${teams().map(t=>`<th style="color:${t.c}">${t.num} · ${esc(t.name)}</th>`).join("")}</tr>
    ${r.cr.map((c,k)=>`<tr><td>${c[0]}</td>${teams().map(t=>`<td><input type="checkbox" id="rb${t.i}_${k}" data-rub="${t.i}-${k}" ${(S.rub[t.i]||[]).includes(k)?"checked":""}></td>`).join("")}</tr>`).join("")}
    <tr><td><b>Total</b></td>${teams().map(t=>`<td><b style="font-size:22px">${modPts(8,t.i)}</b></td>`).join("")}</tr></table></div>`;
  }else if(d.k==="final"){
    const T=teams().map(t=>({...t,v:totPts(t.i)})).sort((a,b)=>b.v-a.v);const pod=[T[1],T[0],T[2]].filter(Boolean);const H=[240,170,120];
    h=`<div style="text-align:center"><div class="eb">Resultado final</div><h1>Ranking da Missão Zero</h1>
    <div class="pod">${pod.map(t=>{const p=T.indexOf(t);return`<div style="--tc:${t.c}"><div class="nm">${esc(t.name)}</div><div class="sc">${t.v} pts · ${badges(t.i).length} selo(s)</div><div class="blk" style="height:${H[p]}px">${p+1}º</div></div>`}).join("")}</div>
    <button class="go" data-a="conf">Celebrar</button>
    <p class="quote" style="font-size:34px;margin-top:30px">Nossa Essência é Cuidar, Nossa Cultura é Segurança</p></div>`;
  }
  $("stage").innerHTML=`<div class="sl ${dir<0?"back":""}">${h}</div>`;
  $("stage").scrollTop=0;
  if(d.k==="video")wireVideo();
  $("pg").style.width=((S.i+1)/D.length*100)+"%";
  $("cn").textContent=(S.i+1)+" / "+D.length;
}
let VIDSRC=null;
function wireVideo(){const v=$("vmz"),box=$("vbox");if(!v)return;
  v.addEventListener("ended",()=>{const o=document.createElement("div");o.className="vend";o.innerHTML=`<div><h3>E você, o que leva desse vídeo?</h3><p>Agora é a vez do grupo conversar.</p><button data-a="next">Abrir as perguntas para o grupo</button></div>`;box.appendChild(o)});
  v.addEventListener("error",()=>{box.innerHTML=`<div class="vmiss"><h3 style="font-family:var(--disp);font-size:32px;margin:0 0 8px">Vídeo não encontrado</h3><p style="font-size:18px">Deixe o arquivo <b>momento_seguranca.mp4</b> na mesma pasta desta apresentação, ou escolha o vídeo agora.</p><label><span style="display:inline-block;padding:12px 22px;border-radius:10px;background:var(--acc);color:#14243A;font-weight:800;cursor:pointer">Escolher vídeo</span><input type="file" accept="video/*" id="vpick2" hidden></label></div>`})}
function go(i){const ov=document.getElementById("vmz");if(ov)try{ov.pause()}catch(e){}if(i<0||i>=D.length)return;dir=i>=S.i?1:-1;S.i=i;showRev=false;stopCd();save();render()}
function stopCd(){clearInterval(cdn);cdn=null}
function startCd(min){stopCd();const tot=min*60;let left=tot;const u=()=>{const v=$("cdv"),b=$("cdb");if(!v)return stopCd();v.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");b.style.width=(left/tot*100)+"%";b.style.background=left<=30?"var(--r)":"var(--y)"};u();cdn=setInterval(()=>{left--;u();if(left<=0){stopCd();beep()}},1000)}
let actx;function beep(){try{actx=actx||new AudioContext();[0,.3,.6].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.25);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.25)})}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confetti(){for(let i=0;i<160;i++){const c=document.createElement("div");c.className="conf";c.style.left=Math.random()*100+"vw";c.style.background=TC[i%8];c.style.animationDuration=(2+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5500)}}
function lancar(){
  const d=D[S.i],v=($("code").value||"").toUpperCase().replace(/[^0-9A-Z]/g,""),mm=v.match(/^([1-8])([1-7])(\d{3})([A-Z]{2})$/),msg=$("msg");
  if(!mm){msg.className="msg bad";msg.textContent="Código incompleto: são 5 números e 2 letras.";return}
  const t=+mm[1],m=+mm[2],p=+mm[3];
  if(chk(t,m,p)!==mm[4]){msg.className="msg bad";msg.textContent="Código inválido. Peça para a equipe conferir.";return}
  if(t>S.n){msg.className="msg bad";msg.textContent="Equipe "+t+" não está cadastrada.";return}
  S.sc[m]=S.sc[m]||{};const had=S.sc[m][t-1]!=null;S.sc[m][t-1]=p;save();render();
  const ms=$("msg");ms.className="msg ok";ms.textContent=`${S.names[t-1]}: ${p} pts no módulo ${m}${had?" (atualizado)":""}${m!==d.m?" · atenção: código do módulo "+m:""}`;
  $("code").focus();
}
function menu(){
  const m=document.createElement("div");m.className="menu";
  const firsts=[];D.forEach((d,i)=>{if((d.k==="intro")||(i===1&&d.m===0))firsts.push([i,d.m])});
  m.innerHTML=`<div class="card"><h2 style="font-size:36px">Ir para</h2><button class="it" style="--mc:#666" data-j="0">Configuração das equipes</button>${firsts.map(([i,id])=>{const s=stn(id);return`<button class="it" style="--mc:${s.c}" data-j="${i}">${id===0?"Abertura":id===8?"Missão Gemba (campo)":id+". "+s.name}<span>${s.min} min</span></button>`}).join("")}${D.map((d,i)=>d.k==="placar"?`<button class="it" style="--mc:${stn(d.m).c}" data-j="${i}">Placar do módulo ${d.m}<span>placar</span></button>`:"").join("")}<button data-a="close" style="margin-top:10px">Fechar</button></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{const b=e.target.closest("[data-j],[data-a=close]");if(e.target===m||b){m.remove();if(b&&b.dataset.j)go(+b.dataset.j)}});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest(".menu"))return;
  const a=b.dataset.a;
  if(a==="next")go(S.i+1);else if(a==="prev")go(S.i-1);else if(a==="menu")menu();
  else if(a==="cd")startCd(+b.dataset.min);
  else if(a==="code")lancar();
  else if(a==="rev"){showRev=!showRev;render()}
  else if(a==="t0"){S.t0=Date.now();save();render()}
  else if(a==="conf")confetti();
  else if(a==="reset"){if(b.dataset.c){S.sc={};S.voz={};S.rub={};save();toast("Placar zerado");render()}else{b.dataset.c=1;b.textContent="Confirmar: zerar tudo?";setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent="Zerar placar"}},3000)}}
  else if(b.dataset.voz!==undefined){const m=D[S.i].m,t=+b.dataset.voz;const v=S.voz[m]||[];S.voz[m]=v.includes(t)?v.filter(x=>x!==t):[...v,t];save();render()}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.tn!==undefined){S.names[+t.dataset.tn]=t.value;save()}
  else if(t.dataset.kv){S[t.dataset.kv]=t.value;save();if(t.dataset.kv==="app"){const q=document.querySelector(".qrw");if(q)q.outerHTML=qrBlock("App das equipes")}}
  else if(t.dataset.ref!==undefined){S.refs[+t.dataset.ref]=+t.value;save();const o=$("rv"+t.dataset.ref);if(o)o.textContent=showRev?t.value:"?";if(showRev)render()}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="nsel"){S.n=+t.value;save();render()}
  else if(t.dataset.rub){const[i,k]=t.dataset.rub.split("-").map(Number);const a=S.rub[i]||[];S.rub[i]=t.checked?[...a,k]:a.filter(x=>x!==k);save();render()}
  else if((t.id==="vpick"||t.id==="vpick2")&&t.files[0]){if(VIDSRC)URL.revokeObjectURL(VIDSRC);VIDSRC=URL.createObjectURL(t.files[0]);render()}
  else if(t.dataset.ph&&t.files[0]){const rd=new FileReader();rd.onload=()=>{photos[t.dataset.ph]=rd.result;render()};rd.readAsDataURL(t.files[0])}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("button")&&(e.key===" "||e.key==="Enter"))return;
  if(e.target.matches("input,select,textarea")){if(e.key==="Enter"&&e.target.id==="code")lancar();return}
  if(document.querySelector(".menu")){if(e.key==="Escape")document.querySelector(".menu").remove();return}
  if(e.key===" "&&D[S.i].k==="video"){e.preventDefault();const v=$("vmz");if(v){v.paused?v.play():v.pause()}return}
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(S.i+1)}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();go(S.i-1)}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(D.length-1);
  else if(e.key.toLowerCase()==="m")menu();
  else if(e.key.toLowerCase()==="f"){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}
});
setInterval(()=>{const c=$("clk");if(!S.t0){c.innerHTML="";return}const el=Math.floor((Date.now()-S.t0)/1000);const h=Math.floor(el/3600),m=Math.floor(el%3600/60),s=el%60;c.innerHTML=`Tempo <b style="color:${el>10800?"var(--r)":"var(--y)"}">${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</b> / 3:00:00 · F tela cheia`},1000);
if(S.i>=D.length)S.i=0;
render();
</script>
</body>
</html>
