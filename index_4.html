function render(){
  stopT();
  const v=S.view;
  if(v==="join")return vJoin();
  if(v==="home")return vHome();
  if(v==="senha")return vSenha();
  if(v==="play")return vPlay();
  if(v==="end")return vEnd();
  if(v==="ms")return vMs();
}
function vMs(){
  const back=S.team?"home":"join";
  if(!S.room){
    $("app").innerHTML=(S.team?head():`<div class="brand">${BRAND}</div><div class="stripe"></div>`)+`<div><div class="eyebrow">Momento de Segurança</div><h2>Entre na sala da conversa</h2></div>
    <div><label for="rm">Código da sala (aparece no telão)</label><input id="rm" maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="Ex.: K7Q2PA"></div><div class="err" id="er"></div>
    <button class="go" data-a="room">Entrar na sala</button><button data-a="msback" data-b="${back}">Voltar</button>`;return}
  S.sent=S.sent||{};const mine=S.sent[S.room]||{};
  S.msi=S.msi||{};let i=S.msi[S.room]||0;
  const top=(S.team?head():`<div class="brand">${BRAND}</div><div class="stripe"></div>`)+`<div><div class="eyebrow">Momento de Segurança · sala ${esc(S.room)}</div></div>
  <div class="msdots">${MSQ.map((q,k)=>`<span class="${k<i?"ok":k===i?"cur":""}" style="--qc:${q[2]}"></span>`).join("")}</div>`;
  if(i>=MSQ.length){
    const n=Object.values(mine).reduce((s,a)=>s+a.length,0);
    $("app").innerHTML=top+`<div class="msdone"><div class="big" style="font-size:64px">✓</div><h2>Respostas enviadas!</h2><p class="mu">Você enviou ${n} insight${n===1?"":"s"}. Acompanhe o mapa mental no telão.</p></div>
    <button class="go" data-a="msback" data-b="${back}">Voltar</button><button data-a="msgo" data-i="0">Responder de novo</button>`;return}
  const q=MSQ[i];
  $("app").innerHTML=top+`<div class="msq msin" style="--qc:${q[2]}"><div class="lb">Pergunta ${i+1} de ${MSQ.length} · ${q[0]}</div><p>${q[1]}</p>
   <div class="msrow"><input id="ms${i}" maxlength="40" autocomplete="off" placeholder="Uma palavra ou frase curta"><button data-a="mssend" data-q="${i}">Enviar</button></div>
   <div class="err" id="me${i}" style="min-height:0"></div>
   ${(mine[i]||[]).length?`<div class="sent">${mine[i].map(w=>`<span>✓ ${esc(w)}</span>`).join("")}</div>`:""}</div>
  <div class="msnav">${i>0?`<button class="link" data-a="msgo" data-i="${i-1}">‹ Pergunta anterior</button>`:"<span></span>"}<button class="link" data-a="msgo" data-i="${i+1}">${(mine[i]||[]).length?"Próxima ›":"Pular ›"}</button></div>
  <button data-a="msback" data-b="${back}">Sair</button>`;
  setTimeout(()=>{const n=$("ms"+i);n&&n.focus()},60);
}
async function msSend(i){
  const inp=$("ms"+i),w=(inp.value||"").trim().replace(/\s+/g," ");if(!w)return;
  const btn=document.querySelector(`[data-a=mssend][data-q="${i}"]`);btn.disabled=true;$("me"+i).textContent="";
  try{const r=await fetch(RELAY+"missaozero-frisia-"+S.room.toLowerCase(),{method:"POST",body:JSON.stringify({q:i,w:w.slice(0,40),t:S.team||0})});
    if(!r.ok)throw new Error(r.status);
    S.sent=S.sent||{};S.sent[S.room]=S.sent[S.room]||{};(S.sent[S.room][i]=S.sent[S.room][i]||[]).push(w);S.msi=S.msi||{};S.msi[S.room]=i+1;save();pop("✓",false);vMs()}
  catch(e){btn.disabled=false;$("me"+i).textContent=e.message==="429"?"Muitos envios ao mesmo tempo. Aguarde alguns segundos e envie de novo.":"Não foi possível enviar. Confira a internet e tente de novo."}

function vHome(){
  $("app").innerHTML=head()+`
  <button class="mscard" data-a="ms"><div><b>Momento de Segurança</b><span>Responder as perguntas do vídeo · mapa mental ao vivo</span></div><span style="margin-left:auto;font-size:24px">›</span></button>
  <div><div class="eyebrow">Módulos</div><p class="mu" style="margin:4px 0 0">Toque no módulo quando o facilitador mostrar a senha no telão.</p></div>
  <div class="mods">${MODS.map(m=>{const st=S.mods[m.id];return`<button class="mod ${st&&st.done?"done":""}" style="--mc:${m.c}" data-m="${m.id}"><div class="badge">${m.id}</div><div><b>${m.name}</b><span>${st&&st.done?"Concluído · toque para ver o código":st?"Em andamento":m.qs.length+(m.risk?" perguntas + 4 fotos":" perguntas")}</span></div><div class="st">${st&&st.done?st.pts:"›"}</div></button>`}).join("")}</div>
  <div><div class="eyebrow" style="margin-bottom:6px">Poderes da equipe (1 uso no treinamento)</div>
  <div class="rows"><div><span>2x Gemba: dobra os pontos de uma pergunta</span><b>${S.pw.dobro?"disponível":"usado"}</b></div><div><span>Chame o Líder: elimina 2 alternativas erradas</span><b>${S.pw.lider?"disponível":"usado"}</b></div></div></div>
  <button data-a="leave" style="background:none;border:0;color:var(--mu);font-size:13px">Trocar de equipe</button>`;
}
function vSenha(){
  const m=modById(E.m);
  $("app").innerHTML=head()+`<div><div class="eyebrow" style="color:${m.c}">Módulo ${m.id}</div><h2>${m.name}</h2></div>
  <div><label for="pw">Senha do módulo</label><input id="pw" autocomplete="off" autocapitalize="characters" placeholder="Veja no telão"></div>
  <div class="err" id="er"></div>
  <button class="go" data-a="unlock">Liberar perguntas</button>
  <button data-a="home">Voltar</button>`;
  setTimeout(()=>$("pw")&&$("pw").focus(),50);
}
function cur(){return S.mods[E.m]}
function vPlay(){
  stopT();
  const m=modById(E.m),st=cur();
  const n=m.qs.length+(m.risk?1:0);
  if(st.i>=m.qs.length){ if(m.risk)return vRisk(m,st); return finish(); }
  const q=m.qs[st.i];
  const ans=st.a[st.i];
  let body="";
  if(q.t==="quiz"){
    body=`<div class="q">${q.q}</div><div class="opts">${q.o.map((o,k)=>{let c="";if(ans){c=k===q.c?"ok":(k===ans.k?"bad":"off")}else if((E.elim||[]).includes(k))c="gone";return`<button class="opt ${c}" data-o="${k}" ${ans||c==="gone"?"disabled":""}><i>${"ABCD"[k]}</i><span>${o}</span></button>`}).join("")}</div>`;
  }else{
    E.ord=E.ord||[];
    const shown=st.sh[st.i];
    body=`<div class="q">${q.q}</div><p class="mu" style="margin:0">Toque nas etapas na ordem correta.</p><div class="pick">${shown.map(ix=>{const pos=ans?ans.seq.indexOf(ix):E.ord.indexOf(ix);let c=pos>=0?"sel":"";if(ans)c=pos===ix?"ok sel":"bad sel";return`<button class="${c}" data-p="${ix}" ${ans?"disabled":""}><em>${pos>=0?pos+1:"·"}</em>${q.items[ix]}</button>`}).join("")}</div>
    ${ans?"":`<div class="pw"><button data-a="undo" ${E.ord.length?"":"disabled"}>Desfazer</button><button class="go" style="flex:2;font-size:18px" data-a="sendord" ${E.ord.length===q.items.length?"":"disabled"}>Confirmar ordem</button></div>`}`;
  }
  let fb="";
  if(ans){fb=`<div class="fb ${ans.p>0?"":"bad"}"><b>${ans.p>0?(q.t==="order"&&ans.p<15?"Quase! +"+ans.p:"Certo! +"+ans.p):(ans.to?"Tempo esgotado":"Não foi dessa vez")}</b>${q.t==="quiz"?q.e:"Ordem correta: "+q.items.map((x,i)=>(i+1)+". "+x).join(" · ")}</div><button class="go" data-a="next">${st.i+1>=n?"Ver resultado":"Próxima"}</button>`}
  const lim=q.t==="order"?90:45;
  $("app").innerHTML=head()+`<div><div class="eyebrow" style="color:${m.c}">Módulo ${m.id} · ${m.name}</div></div>
  <div class="meta"><span>Pergunta ${st.i+1} de ${n}</span><span id="tl">${ans?"":lim+"s"}</span></div>
  <div class="timer"><i id="tb" style="${ans?"width:0":""}"></i></div>
  ${ans?"":`<div class="pw"><button class="${E.armed?"arm":""}" data-a="dobro" ${S.pw.dobro||E.armed?"":"disabled"}>2x Gemba</button><button data-a="lider" ${S.pw.lider&&q.t==="quiz"&&!(E.elim||[]).length?"":"disabled"}>Chame o Líder</button></div>`}
  ${body}${fb}`;
  if(!ans){let left=E.left??lim;E.left=left;const u=()=>{const t=$("tl"),b=$("tb");if(!t)return stopT();t.textContent=left+"s";b.style.width=(left/lim*100)+"%";b.style.background=left<=10?"var(--r)":"var(--y)"};u();
    tmr=setInterval(()=>{left--;E.left=left;u();if(left<=0){stopT();answer(q.t==="quiz"?{k:-1,to:1}:{seq:E.ord.concat(q.items.map((_,i)=>i).filter(i=>!E.ord.includes(i))),to:1})}},1000)}
}
function answer(a){
  const m=modById(E.m),st=cur(),q=m.qs[st.i];
  let p=0;
  if(q.t==="quiz")p=a.k===q.c?10:0;
  else{const ok=a.seq.filter((ix,pos)=>ix===pos).length;p=Math.round(15*ok/q.items.length);if(ok===q.items.length)p=15}
  if(E.armed&&p>0)p*=2;
  if(E.armed){E.armed=false}
  a.p=p;st.a[st.i]=a;st.pts=(st.pts||0)+p;save();
  pop(p>0?"+"+p:(a.to?"Tempo!":"0"),p===0);
  E.left=null;render();
}
function vRisk(m,st){
  const r=st.risk||(st.risk={v:[5,5,5,5],lock:false,ref:null});
  if(r.ref){
    const pts=r.v.map((v,i)=>riskPts(v,r.ref[i]));
    $("app").innerHTML=head()+`<div><div class="eyebrow" style="color:${m.c}">Módulo 4 · Percepção de Risco</div><h2>Resultado das fotos</h2></div>
    <div class="rows">${r.v.map((v,i)=>`<div><span>Foto ${i+1}: equipe ${v} · SST ${r.ref[i]}</span><b style="color:${pts[i]?"var(--g)":"var(--r)"}">+${pts[i]}</b></div>`).join("")}</div>
    <button class="go" data-a="finrisk">Ver resultado do módulo</button>`;return;
  }
  $("app").innerHTML=head()+`<div><div class="eyebrow" style="color:${m.c}">Módulo 4 · Percepção de Risco</div><h2>Classifique as fotos do telão</h2></div>
  <p class="mu" style="margin:0">Discutam em equipe e definam uma nota de 0 a 10 para cada foto. Quanto mais perto da nota do SST, mais pontos (até 10 por foto).</p>
  <div class="scale"></div><div class="meta"><span>0 baixo</span><span>5 médio</span><span>10 alto</span></div>
  ${r.v.map((v,i)=>`<div class="rk"><b>Foto ${i+1}</b><input type="range" min="0" max="10" value="${v}" data-r="${i}" id="r${i}" ${r.lock?"disabled":""}><output id="o${i}">${v}</output></div>`).join("")}
  ${r.lock?`<div><label for="rv">Senha de revelação (aparece no telão)</label><input id="rv" autocomplete="off" autocapitalize="characters" maxlength="4" placeholder="4 letras"></div><div class="err" id="er"></div><button class="go" data-a="reveal">Ver pontuação</button>`
  :`<button class="go" data-a="lock">Travar notas da equipe</button><p class="mu" style="margin:0;font-size:13px">Depois de travar, não é possível alterar.</p>`}`;
}
async function sendScore(id){const st=S.mods[id];if(!st||!st.done||st.sent||!S.room||!S.team)return false;
  try{const r=await fetch(RELAY+"missaozero-frisia-"+S.room.toLowerCase(),{method:"POST",body:JSON.stringify({k:"score",t:S.team,m:id,p:st.pts,c:chk(S.team,id,st.pts)})});if(!r.ok)throw 0;st.sent=true;save();return true}catch(e){return false}}
async function syncScores(){for(const id in S.mods){await sendScore(+id)}if(S.view==="end"&&E.m)vEnd()}
function finish(){
  const m=modById(E.m),st=cur();
  const allOk=m.qs.every((q,i)=>st.a[i]&&(q.t==="quiz"?st.a[i].p>0:st.a[i].p>=15));
  if(!st.done){st.bonus=allOk?5:0;st.pts=(st.pts||0)+st.bonus;st.done=true;save()}
  S.view="end";save();vEnd();
  sendScore(m.id).then(()=>{if(S.view==="end")vEnd()});
  if(!E.shown){E.shown=1;pop("+"+st.pts,false)}
}
function vEnd(){
  const m=modById(E.m),st=cur();
  const ok=m.qs.filter((q,i)=>st.a[i]&&st.a[i].p>0).length;
  $("app").innerHTML=head()+`<div><div class="eyebrow" style="color:${m.c}">Módulo ${m.id} concluído</div><h2>${m.name}</h2></div>
  <div class="big">${st.pts}<span style="font-size:28px;color:var(--mu)"> pts</span></div>
  <div class="rows"><div><span>Acertos</span><b>${ok} de ${m.qs.length}</b></div>${m.risk?`<div><span>Percepção de Risco (4 fotos)</span><b>+${st.rpts||0}</b></div>`:""}<div><span>Bônus módulo perfeito</span><b>${st.bonus?"+5":"—"}</b></div></div>
  ${st.sent?`<div class="sync ok"><b>✓ Pontuação enviada ao telão</b><span>O placar do módulo foi atualizado automaticamente.</span></div>`
   :`<div class="sync"><b>${S.room?"Enviando pontuação ao telão…":"Placar automático indisponível"}</b><span>${S.room?"Se não atualizar, toque em reenviar ou mostre o código ao facilitador.":"Abra o app pelo QR code do telão. Enquanto isso, mostre o código ao facilitador."}</span>${S.room?`<button data-a="resend">Reenviar</button>`:""}</div>
   <div><div class="eyebrow" style="margin-bottom:6px">Código reserva</div><div class="code" style="font-size:34px">${codeOf(S.team,m.id,st.pts)}</div></div>`}
  <button class="go" data-a="home">Voltar aos módulos</button>`;
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.n){E.n=+b.dataset.n;return vJoin()}
  if(b.dataset.m){E={m:+b.dataset.m};const st=S.mods[E.m];if(st&&st.done){S.view="end";return render()}if(st){S.view="play";return render()}S.view="senha";return render()}
  if(b.dataset.o!==undefined){stopT();return answer({k:+b.dataset.o})}
  if(b.dataset.p!==undefined){const ix=+b.dataset.p;if(!E.ord.includes(ix))E.ord.push(ix);const l=E.left;return vPlay()}
  const a=b.dataset.a;
  if(a==="resend"){b.disabled=true;sendScore(E.m).then(()=>vEnd());return}
  if(a==="ms"){S.view="ms";save();return render()}
  if(a==="msback"){S.view=b.dataset.b;save();return render()}
  if(a==="mssend")return msSend(+b.dataset.q);
  if(a==="msgo"){S.msi=S.msi||{};S.msi[S.room]=+b.dataset.i;save();return vMs()}
  if(a==="newroom"){S.room=null;save();return render()}
  if(a==="room"){const v=($("rm").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(v.length<4){$("er").textContent="Digite o código que aparece no telão.";return}S.room=v;save();return render()}
  if(a==="join"){if(!E.n){$("er").textContent="Toque no número da sua equipe.";return}S.team=E.n;S.name=teamList()[E.n-1];S.view="home";save();E={};render()}
  else if(a==="home"){S.view="home";save();E={};render()}
  else if(a==="leave"){S.view="join";save();E={};render()}
  else if(a==="unlock"){const v=$("pw").value.toUpperCase().replace(/\s/g,"");const m=modById(E.m);if(hh("MZ|"+v)===SEN[m.id]){const sh=m.qs.map(q=>q.t==="order"?q.items.map((_,i)=>i).sort(()=>Math.random()-.5):null);S.mods[m.id]={i:0,a:{},pts:0,sh,done:false};S.view="play";save();render()}else{$("er").textContent="Senha incorreta. Confira no telão.";$("pw").classList.add("shake");setTimeout(()=>$("pw")&&$("pw").classList.remove("shake"),400)}}
  else if(a==="next"){cur().i++;E.ord=[];E.elim=[];E.left=null;save();render()}
  else if(a==="dobro"){if(E.armed){E.armed=false;S.pw.dobro=true}else{E.armed=true;S.pw.dobro=false}save();vPlay()}
  else if(a==="lider"){const q=modById(E.m).qs[cur().i];E.elim=q.o.map((_,k)=>k).filter(k=>k!==q.c).sort(()=>Math.random()-.5).slice(0,2);S.pw.lider=false;save();vPlay()}
  else if(a==="undo"){E.ord.pop();vPlay()}
  else if(a==="sendord"){stopT();answer({seq:E.ord.slice()})}
  else if(a==="lock"){cur().risk.lock=true;save();render()}
  else if(a==="reveal"){const v=$("rv").value.toUpperCase().trim();const ref=[...v].map(c=>RALPH.indexOf(c));if(v.length!==4||ref.some(x=>x<0)){$("er").textContent="Senha inválida. Confira as 4 letras no telão.";return}cur().risk.ref=ref;save();render()}
  else if(a==="finrisk"){const st=cur();if(st.rpts==null){st.rpts=st.risk.v.reduce((s,v,i)=>s+riskPts(v,st.risk.ref[i]),0);st.pts+=st.rpts}save();finish()}
});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.r!==undefined){const st=cur();st.risk.v[+t.dataset.r]=+t.value;$("o"+t.dataset.r).textContent=t.value;save()}if(t.id==="nm")E.nm=t.value});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id&&ev.target.id.startsWith("ms")&&ev.target.id.length===3){msSend(+ev.target.id[2]);return}if(ev.key==="Enter"&&ev.target.id==="rm"){document.querySelector("[data-a=room]")?.click();return}if(ev.key==="Enter"){if(S.view==="senha")document.querySelector('[data-a=unlock]')?.click();else if(S.view==="join")document.querySelector('[data-a=join]')?.click()}});
if(S.view==="senha"||S.view==="play"||S.view==="end"){if(!S._m)S.view="home"}
(function(){const q=(location.hash||"").match(/eq=([^&]*)/);if(q){try{const L=q[1].split("~").map(x=>decodeURIComponent(x)).filter(Boolean).slice(0,8);if(L.length){S.teams=L;if(S.team&&L[S.team-1])S.name=L[S.team-1];save()}}catch(e){}}
  const m=(location.hash||"").match(/sala-([A-Za-z0-9]{4,8})/);if(m){if(S.room!==m[1].toUpperCase()){S.room=m[1].toUpperCase()}if(/(^|[#&])ms($|&)/.test(location.hash))S.view="ms";save()}})();
syncScores();
render();
</script>
